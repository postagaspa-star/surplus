# Surplus sul NAS. Risponde solo sulla rete locale, porta 8600.
#
# Per usarlo anche fuori casa (quando il telefono tornera' a funzionare) si
# aggiunge un contenitore Tailscale come quelli di Pactum e Sol: serve una
# chiave di Tailscale, da mettere a mano.
services:
  surplus:
    build: .
    image: surplus-nas:1.0.0
    container_name: surplus
    restart: unless-stopped
    ports:
      - "8600:8000"
    volumes:
      - /volume1/docker/surplus-nas/dati:/dati
      - /volume1/docker/surplus-nas/pacchetti:/pacchetti
    environment:
      TZ: Europe/Rome
